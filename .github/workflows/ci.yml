name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # Product acceptance cases, kept in the TITLE_CASES repository variable; runs once title.js exists.
      - name: acceptance
        env:
          CASES: ${{ vars.TITLE_CASES }}
        run: |
          [ -f title.js ] || exit 0
          node --input-type=module -e '
            import assert from "node:assert/strict";
            const { titleCase } = await import(process.cwd() + "/title.js");
            for (const [input, want] of JSON.parse(process.env.CASES))
              assert.equal(titleCase(input), want, `titleCase(${JSON.stringify(input)})`);
          '
